<VirtualHost *:80>
    ServerName bountywell.com
    ServerAlias www.bountywell.com bountywell.app www.bountywell.app

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/bountywell_error.log
    CustomLog ${APACHE_LOG_DIR}/bountywell_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName bountywell.com
    ServerAlias www.bountywell.com bountywell.app www.bountywell.app

    DocumentRoot /var/www/bountywell.com
    <Directory /var/www/bountywell.com>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3000/api/
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/

    <Directory /var/www/bountywell.com/data>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bountywell_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/bountywell_ssl_access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bountywell.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bountywell.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
